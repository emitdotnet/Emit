version: 2

# One grouped PR per ecosystem instead of one PR per package. Groups also
# apply to security updates, so a batch of advisories lands as a single PR.
updates:
  - package-ecosystem: npm
    directory: /docs
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
    groups:
      docs-security:
        applies-to: security-updates
        patterns: ['*']
      docs:
        applies-to: version-updates
        patterns: ['*']
        update-types: [minor, patch]

  # Security updates only. Library dependencies flow to NuGet consumers as
  # minimum versions, so they stay at the lowest compatible version and are
  # raised by hand (see Directory.Packages.props). A limit of 0 disables
  # version updates without affecting security updates.
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    commit-message:
      prefix: chore(deps)
    groups:
      nuget-security:
        applies-to: security-updates
        patterns: ['*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
    groups:
      actions:
        patterns: ['*']
