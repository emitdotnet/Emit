version: 2

# One grouped PR per ecosystem instead of one PR per package. Groups also
# apply to security updates, so a batch of advisories lands as a single PR.
updates:
  - package-ecosystem: npm
    directory: /docs
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
    groups:
      docs-security:
        applies-to: security-updates
        patterns: ['*']
      docs:
        applies-to: version-updates
        patterns: ['*']
        update-types: [minor, patch]

  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
    groups:
      nuget-security:
        applies-to: security-updates
        patterns: ['*']
      nuget:
        applies-to: version-updates
        patterns: ['*']
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
    groups:
      actions:
        patterns: ['*']
