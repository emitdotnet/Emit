name: Deploy Docs

# Manually publish the documentation site to GitHub Pages without running the
# full .NET test suite or cutting a release tag. Trigger from the Actions tab.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Serialize against the tag-triggered Pages deploy in publish.yml so the two
# never race for the github-pages environment.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy-docs:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - uses: actions/checkout@v6

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: docs/package-lock.json

    - name: Install dependencies
      working-directory: docs
      run: npm ci

    - name: Build docs
      working-directory: docs
      run: npm run build

    - name: Configure Pages
      uses: actions/configure-pages@v6

    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v5
      with:
        path: docs/dist

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v5
